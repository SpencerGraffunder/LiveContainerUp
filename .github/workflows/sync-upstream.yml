name: Sync upstream (weekly rebase)

on:
  schedule:
    # Sunday ~09:00 Eastern
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/LiveContainer/LiveContainer.git
      UPSTREAM_BRANCH: main
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebase main onto upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "LiveContainerUp sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH" --quiet
          UP=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          MB=$(git merge-base origin/main "$UP" || true)
          if [ "$MB" = "$UP" ]; then
            echo "upstream/$UPSTREAM_BRANCH is already merged into main - nothing to do"
            exit 0
          fi
          echo "upstream has $(git rev-list --count "$MB".."$UP") new commit(s); rebasing fork commits onto $UP"
          git checkout -B main "origin/main"
          if git rebase "$UP"; then
            git push --force-with-lease origin main
            touch .sync_rebased
            echo "::notice::main rebased onto upstream and force-pushed"
          else
            CONFLICT=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git rebase --abort
            git branch -f sync/upstream "$UP"
            git push --force origin sync/upstream
            if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head sync/upstream --state open --json number --jq '.[0].number // ""')" ]; then
              BODY=$(printf 'The weekly sync-upstream job could not rebase main onto upstream %s (%s).\n\nLikely conflict area: %s\n\nOptions:\n1. **Merge this PR** - quick unblock; adds a merge commit instead of a clean rebase (the next weekly run continues from there).\n2. **Rebase by hand**: `git fetch upstream && git rebase upstream/%s main`, resolve, then `git push --force-with-lease`.\n\nA fork build is published after a successful rebase or a manual dispatch of "Build LiveContainerUp".' "$UPSTREAM_BRANCH" "$UP" "${CONFLICT:-unknown}" "$UPSTREAM_BRANCH")
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head sync/upstream \
                --title "Weekly upstream sync: rebase conflict - manual resolution needed" \
                --body "$BODY"
            else
              echo "sync PR already open; branch updated"
            fi
            echo "::warning::rebase conflicted - opened/updated the sync/upstream PR"
          fi
      - name: Trigger a build of the rebased main
        if: always() && hashFiles('.sync_rebased') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push made with GITHUB_TOKEN does not start workflows, so kick the
          # build + release pipeline explicitly after a successful rebase.
          gh workflow run build.yml --ref main
          echo "dispatched Build LiveContainerUp for the rebased main"
